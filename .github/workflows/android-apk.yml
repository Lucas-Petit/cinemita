name: Android APK

# Compila el APK en la nube (gratis, sin Android Studio local).
# - Siempre genera el APK de debug firmado con la clave de depuración
#   (instalable directamente en cualquier Android).
# - Si el secreto GOOGLE_SERVICES_JSON está definido, habilita Google Sign-In nativo.
# - Si están KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD,
#   también genera el APK y AAB de release firmados (para distribuir o Play Store).

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore google-services.json (if secret set)
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json

      - name: Install dependencies & sync Capacitor
        run: |
          npm ci
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: cinemita-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Decode release keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/cinemita.keystore

      - name: Build signed release APK + AAB
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        with:
          name: cinemita-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
